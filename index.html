<!DOCTYPE html>
<html>
<head>
    <title>Test Simple Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test Chat Connection</h1>
    <div>
        <input type="text" id="username" placeholder="Username">
        <button onclick="login()">Login</button>
    </div>
    <div id="chatArea" style="display:none">
        <div id="messages" style="border:1px solid #ccc; height:300px; overflow:auto; margin:10px 0"></div>
        <input type="text" id="message" placeholder="Pesan">
        <button onclick="sendMessage()">Kirim</button>
    </div>

    <script>
        // GANTI DENGAN ANON KEY ANDA!!!
        const SUPABASE_URL = 'https://fettznnppsfxyaogvgbo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_rhUpbNaUlgj-p-p28HaGeQ_KoxIIVkV';  // <<< GANTI INI dengan anon key asli
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = '';
        
        async function login() {
            currentUser = document.getElementById('username').value;
            if(!currentUser) return alert('Isi username');
            
            document.getElementById('chatArea').style.display = 'block';
            await loadMessages();
            subscribeToMessages();
        }
        
        async function loadMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });
            
            if(error) {
                alert('Error: ' + error.message);
                return;
            }
            
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            data.forEach(msg => {
                messagesDiv.innerHTML += `<div><b>${msg.username}</b>: ${msg.message} <small>${new Date(msg.created_at).toLocaleTimeString()}</small></div>`;
            });
        }
        
        async function sendMessage() {
            const msg = document.getElementById('message').value;
            if(!msg) return;
            
            const { error } = await supabase
                .from('messages')
                .insert([{ username: currentUser, message: msg }]);
            
            if(error) alert('Error: ' + error.message);
            else document.getElementById('message').value = '';
        }
        
        function subscribeToMessages() {
            supabase
                .channel('messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, 
                    (payload) => {
                        const messagesDiv = document.getElementById('messages');
                        messagesDiv.innerHTML += `<div><b>${payload.new.username}</b>: ${payload.new.message} <small>${new Date(payload.new.created_at).toLocaleTimeString()}</small></div>`;
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    })
                .subscribe();
        }
        
        console.log('Script loaded, Supabase URL:', SUPABASE_URL);
    </script>
</body>
</html>
