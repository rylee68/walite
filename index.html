<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Pesan - Dengan Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 0.9em;
        }
        
        .user-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: white;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        
        .user-details h3 {
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .user-details p {
            font-size: 0.8em;
            opacity: 0.9;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
        }
        
        .btn-kirim {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-kirim:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        
        .btn-kirim:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .btn-refresh {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-right: 10px;
            transition: all 0.3s;
        }
        
        .btn-refresh:hover:not(:disabled) {
            background: #5a6268;
        }
        
        .btn-refresh:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .btn-hapus-semua {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-hapus-semua:hover:not(:disabled) {
            background: #c82333;
        }
        
        .btn-hapus-semua:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .notes-header h2 {
            color: #333;
            font-size: 1.3em;
        }
        
        .notes-header span {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
        }
        
        .notes-list {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .note-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }
        
        .note-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .sender-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sender-avatar-small {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        
        .sender-name {
            font-weight: bold;
            color: #333;
        }
        
        .sender-id {
            font-size: 11px;
            color: #999;
            font-family: monospace;
        }
        
        .note-time {
            font-size: 11px;
            color: #999;
        }
        
        .note-message {
            color: #555;
            line-height: 1.5;
            margin-bottom: 12px;
            padding-left: 45px;
        }
        
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 45px;
            transition: all 0.3s;
        }
        
        .delete-btn:hover:not(:disabled) {
            background: #c82333;
            transform: scale(1.05);
        }
        
        .delete-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        
        .empty-state .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }
        
        /* Login Card Styles */
        .login-card {
            text-align: center;
        }
        
        .login-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
            border-radius: 10px 10px 0 0;
        }
        
        .tab-btn.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            font-weight: bold;
        }
        
        .tab-btn:hover:not(.active) {
            background: #f5f5f5;
        }
        
        .login-form {
            display: none;
        }
        
        .login-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .login-card input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        .login-card input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .login-card input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        
        .btn-masuk, .btn-daftar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-masuk:hover:not(:disabled),
        .btn-daftar:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        
        .btn-masuk:disabled,
        .btn-daftar:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .info-text {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 15px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            color: #999;
            font-size: 14px;
        }
        
        .btn-loading {
            position: relative;
            pointer-events: none;
            opacity: 0.7;
        }
        
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            border: 2px solid white;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            animation: slideDown 0.3s ease;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .password-hint {
            font-size: 11px;
            color: #999;
            text-align: left;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        
        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }
        
        .show-password input {
            width: auto;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div class="loading-text">Memuat aplikasi...</div>
        </div>
    </div>

    <script>
        // ============ KONFIGURASI JSONBIN ============
        const API_KEY = '$2a$10$mjq9GqT9KPSNzxJcZzHxxO0LSiDadJfU7fWheRcEQ389dEDUetNfG';
        const BIN_ID = '6a11cd4b6610dd3ae892eb77';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        let currentUser = null;
        
        // Helper function untuk set button loading
        function setButtonLoading(button, isLoading, originalText) {
            if (!button) return;
            if (isLoading) {
                button.disabled = true;
                button.classList.add('btn-loading');
                button.dataset.originalText = originalText || button.innerText;
                button.innerText = 'Memproses...';
            } else {
                button.disabled = false;
                button.classList.remove('btn-loading');
                button.innerText = button.dataset.originalText || originalText || 'Submit';
            }
        }
        
        // ============ FUNGSI JSONBIN ============
        async function ambilSemuaData() {
            try {
                const response = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                
                if (!response.ok) {
                    console.log('Membuat struktur data baru...');
                    return { users: [], notes: [] };
                }
                
                const result = await response.json();
                const data = result.record;
                
                return {
                    users: data.users || [],
                    notes: data.notes || []
                };
            } catch(error) {
                console.error('Error ambil data:', error);
                return { users: [], notes: [] };
            }
        }
        
        async function simpanSemuaData(data) {
            try {
                const dataToSave = {
                    users: data.users || [],
                    notes: data.notes || []
                };
                
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(dataToSave)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Response error:', errorText);
                    return false;
                }
                
                return true;
            } catch(error) {
                console.error('Error simpan data:', error);
                return false;
            }
        }
        
        // ============ FUNGSI LOGIN & REGISTER ============
        function cekSession() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                tampilkanAplikasi();
            } else {
                tampilkanLogin();
            }
        }
        
        // Fungsi Register (Daftar)
        async function register() {
            const namaInput = document.getElementById('registerNama');
            const passwordInput = document.getElementById('registerPassword');
            const daftarBtn = document.querySelector('.btn-daftar');
            
            const nama = namaInput?.value.trim();
            const password = passwordInput?.value;
            
            if (!nama) {
                alert('Masukkan nama Anda!');
                return;
            }
            
            if (!password || password.length < 4) {
                alert('Password minimal 4 karakter!');
                return;
            }
            
            setButtonLoading(daftarBtn, true, 'Daftar');
            namaInput.disabled = true;
            passwordInput.disabled = true;
            
            try {
                const semuaData = await ambilSemuaData();
                
                // Cek apakah nama sudah terdaftar
                const userExists = semuaData.users.find(u => u.nama.toLowerCase() === nama.toLowerCase());
                if (userExists) {
                    alert('❌ Nama sudah terdaftar! Silakan login atau gunakan nama lain.');
                    return;
                }
                
                // Buat user baru dengan password
                const user = {
                    id: Date.now(),
                    nama: nama,
                    password: password, // Simpan password (untuk demo, di real app harus di-hash)
                    createdAt: new Date().toLocaleString('id-ID')
                };
                
                semuaData.users.push(user);
                const berhasil = await simpanSemuaData(semuaData);
                
                if (berhasil) {
                    alert('✅ Pendaftaran berhasil! Silakan login.');
                    // Reset form register
                    namaInput.value = '';
                    passwordInput.value = '';
                    // Pindah ke tab login
                    showLoginTab();
                } else {
                    alert('❌ Gagal mendaftar! Coba lagi.');
                }
            } catch(error) {
                console.error('Error register:', error);
                alert('Terjadi kesalahan: ' + error.message);
            } finally {
                setButtonLoading(daftarBtn, false);
                namaInput.disabled = false;
                passwordInput.disabled = false;
            }
        }
        
        // Fungsi Login
        async function login() {
            const namaInput = document.getElementById('loginNama');
            const passwordInput = document.getElementById('loginPassword');
            const loginBtn = document.querySelector('.btn-masuk');
            
            const nama = namaInput?.value.trim();
            const password = passwordInput?.value;
            
            if (!nama) {
                alert('Masukkan nama Anda!');
                return;
            }
            
            if (!password) {
                alert('Masukkan password Anda!');
                return;
            }
            
            setButtonLoading(loginBtn, true, 'Masuk');
            namaInput.disabled = true;
            passwordInput.disabled = true;
            
            try {
                const semuaData = await ambilSemuaData();
                const user = semuaData.users.find(u => u.nama.toLowerCase() === nama.toLowerCase());
                
                if (!user) {
                    alert('❌ Nama tidak ditemukan! Silakan daftar terlebih dahulu.');
                    return;
                }
                
                // Verifikasi password
                if (user.password !== password) {
                    alert('❌ Password salah! Coba lagi.');
                    return;
                }
                
                // Simulasi delay untuk efek loading
                await new Promise(resolve => setTimeout(resolve, 500));
                
                currentUser = user;
                // Hapus password dari session storage (jangan simpan password di localStorage)
                const userForStorage = {
                    id: user.id,
                    nama: user.nama,
                    createdAt: user.createdAt
                };
                localStorage.setItem('currentUser', JSON.stringify(userForStorage));
                tampilkanAplikasi();
            } catch(error) {
                console.error('Error login:', error);
                alert('Terjadi kesalahan: ' + error.message);
            } finally {
                setButtonLoading(loginBtn, false);
                namaInput.disabled = false;
                passwordInput.disabled = false;
            }
        }
        
        function logout() {
            if (confirm('Yakin ingin logout?')) {
                currentUser = null;
                localStorage.removeItem('currentUser');
                tampilkanLogin();
            }
        }
        
        // Toggle tab login/register
        function showLoginTab() {
            document.getElementById('loginTab')?.classList.add('active');
            document.getElementById('registerTab')?.classList.remove('active');
            document.getElementById('loginForm')?.classList.add('active');
            document.getElementById('registerForm')?.classList.remove('active');
        }
        
        function showRegisterTab() {
            document.getElementById('registerTab')?.classList.add('active');
            document.getElementById('loginTab')?.classList.remove('active');
            document.getElementById('registerForm')?.classList.add('active');
            document.getElementById('loginForm')?.classList.remove('active');
        }
        
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
        
        // ============ FUNGSI CATATAN ============
        async function kirimPesan() {
            const pesanInput = document.getElementById('pesan');
            const kirimBtn = document.querySelector('.btn-kirim');
            
            if (!pesanInput) {
                alert('Error: Form pesan tidak ditemukan');
                return;
            }
            
            const pesan = pesanInput.value.trim();
            
            if (!pesan) {
                alert('✏️ Silakan tulis pesan terlebih dahulu!');
                return;
            }
            
            if (!currentUser) {
                alert('❌ Anda belum login!');
                return;
            }
            
            setButtonLoading(kirimBtn, true, 'Kirim');
            
            try {
                const semuaData = await ambilSemuaData();
                
                const pesanBaru = {
                    id: Date.now(),
                    userId: currentUser.id,
                    userName: currentUser.nama,
                    pesan: pesan,
                    waktu: new Date().toLocaleString('id-ID', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })
                };
                
                semuaData.notes.unshift(pesanBaru);
                
                const berhasil = await simpanSemuaData(semuaData);
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                if (berhasil) {
                    pesanInput.value = '';
                    tampilkanPesan('✅ Pesan berhasil dikirim!', 'success');
                    await tampilkanSemuaPesan();
                } else {
                    alert('❌ Gagal mengirim pesan! Coba lagi.');
                }
            } catch(error) {
                console.error('Error kirim pesan:', error);
                alert('❌ Terjadi error: ' + error.message);
            } finally {
                setButtonLoading(kirimBtn, false);
            }
        }
        
        async function tampilkanSemuaPesan() {
            const container = document.getElementById('notesContainer');
            const refreshBtn = document.querySelector('.btn-refresh');
            
            if (!container) return;
            
            container.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <div class="loading-text">Memuat pesan...</div>
                </div>
            `;
            
            if (refreshBtn) refreshBtn.disabled = true;
            
            try {
                const semuaData = await ambilSemuaData();
                const semuaPesan = semuaData.notes || [];
                
                await new Promise(resolve => setTimeout(resolve, 300));
                
                if (semuaPesan.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state fade-in">
                            <div class="emoji">💬</div>
                            <p>Belum ada pesan. Kirim pesan pertama Anda!</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                for (let pesan of semuaPesan) {
                    const isOwner = currentUser && pesan.userId === currentUser.id;
                    html += `
                        <div class="note-card fade-in">
                            <div class="note-header">
                                <div class="sender-info">
                                    <div class="sender-avatar-small">
                                        ${escapeHtml(pesan.userName.charAt(0).toUpperCase())}
                                    </div>
                                    <div>
                                        <div class="sender-name">${escapeHtml(pesan.userName)}</div>
                                        <div class="sender-id">🆔 ID: ${pesan.userId}</div>
                                    </div>
                                </div>
                                <div class="note-time">📅 ${pesan.waktu}</div>
                            </div>
                            <div class="note-message">
                                ${escapeHtml(pesan.pesan)}
                            </div>
                            ${isOwner ? `<button class="delete-btn" onclick="hapusPesan(${pesan.id})">🗑️ Hapus</button>` : ''}
                        </div>
                    `;
                }
                
                const totalSpan = document.getElementById('totalPesan');
                if (totalSpan) totalSpan.textContent = semuaPesan.length;
                
                container.innerHTML = html;
            } catch(error) {
                console.error('Error tampilkan pesan:', error);
                container.innerHTML = `
                    <div class="alert alert-error fade-in">
                        ❌ Gagal memuat pesan. Silakan refresh halaman.
                    </div>
                `;
            } finally {
                if (refreshBtn) refreshBtn.disabled = false;
            }
        }
        
        async function hapusPesan(id) {
            if (!confirm('Yakin ingin menghapus pesan ini?')) return;
            
            const deleteButtons = document.querySelectorAll('.delete-btn');
            let targetBtn = null;
            for (let btn of deleteButtons) {
                if (btn.getAttribute('onclick') === `hapusPesan(${id})`) {
                    targetBtn = btn;
                    break;
                }
            }
            
            if (targetBtn) {
                targetBtn.disabled = true;
                targetBtn.innerText = 'Menghapus...';
            }
            
            try {
                const semuaData = await ambilSemuaData();
                semuaData.notes = semuaData.notes.filter(item => item.id !== id);
                
                const berhasil = await simpanSemuaData(semuaData);
                
                await new Promise(resolve => setTimeout(resolve, 300));
                
                if (berhasil) {
                    tampilkanPesan('✅ Pesan dihapus!', 'success');
                    await tampilkanSemuaPesan();
                } else {
                    alert('❌ Gagal menghapus!');
                }
            } catch(error) {
                console.error('Error hapus pesan:', error);
                alert('❌ Terjadi error!');
            } finally {
                if (targetBtn) {
                    targetBtn.disabled = false;
                    targetBtn.innerText = '🗑️ Hapus';
                }
            }
        }
        
        async function hapusSemuaPesan() {
            if (!confirm('⚠️ PERINGATAN: Ini akan menghapus SEMUA pesan dari semua pengguna! Lanjutkan?')) return;
            
            const hapusBtn = document.querySelector('.btn-hapus-semua');
            setButtonLoading(hapusBtn, true, 'Hapus Semua');
            
            try {
                const semuaData = await ambilSemuaData();
                semuaData.notes = [];
                
                const berhasil = await simpanSemuaData(semuaData);
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                if (berhasil) {
                    tampilkanPesan('🗑️ Semua pesan telah dihapus!', 'success');
                    await tampilkanSemuaPesan();
                } else {
                    alert('❌ Gagal menghapus!');
                }
            } catch(error) {
                console.error('Error hapus semua:', error);
                alert('❌ Terjadi error!');
            } finally {
                setButtonLoading(hapusBtn, false);
            }
        }
        
        // ============ FUNGSI TAMPILAN ============
        function tampilkanLogin() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="card login-card fade-in">
                    <div class="header">
                        <div class="login-icon">🔐</div>
                        <h1>Papan Pesan</h1>
                        <p>Kirim pesan dan lihat pesan dari pengguna lain</p>
                    </div>
                    
                    <div class="login-tabs">
                        <button class="tab-btn active" id="loginTab" onclick="showLoginTab()">Login</button>
                        <button class="tab-btn" id="registerTab" onclick="showRegisterTab()">Daftar</button>
                    </div>
                    
                    <div id="loginForm" class="login-form active">
                        <input type="text" id="loginNama" placeholder="Nama Anda" autocomplete="off">
                        <input type="password" id="loginPassword" placeholder="Password">
                        <div class="show-password">
                            <input type="checkbox" onclick="togglePassword('loginPassword')">
                            <span>Tampilkan password</span>
                        </div>
                        <button class="btn-masuk" onclick="login()">🚀 Masuk</button>
                    </div>
                    
                    <div id="registerForm" class="login-form">
                        <input type="text" id="registerNama" placeholder="Nama Anda" autocomplete="off">
                        <input type="password" id="registerPassword" placeholder="Password (minimal 4 karakter)">
                        <div class="show-password">
                            <input type="checkbox" onclick="togglePassword('registerPassword')">
                            <span>Tampilkan password</span>
                        </div>
                        <div class="password-hint">🔒 Password akan disimpan di server. Gunakan password yang mudah diingat!</div>
                        <button class="btn-daftar" onclick="register()">📝 Daftar</button>
                    </div>
                    
                    <div class="info-text">
                        ✨ Daftar dulu jika belum punya akun<br>
                        🔐 Login dengan nama dan password yang sudah didaftarkan
                    </div>
                </div>
            `;
            
            setTimeout(() => {
                const input = document.getElementById('loginNama');
                if (input) input.focus();
            }, 100);
        }
        
        function tampilkanAplikasi() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="card fade-in">
                    <div class="user-bar">
                        <div class="user-info">
                            <div class="avatar">${escapeHtml(currentUser.nama.charAt(0).toUpperCase())}</div>
                            <div class="user-details">
                                <h3>${escapeHtml(currentUser.nama)}</h3>
                                <p>🆔 ID: ${currentUser.id}</p>
                            </div>
                        </div>
                        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
                    </div>
                    
                    <div class="form-group">
                        <label>✏️ Tulis Pesan</label>
                        <textarea id="pesan" rows="3" placeholder="Tulis pesan atau catatan Anda di sini..."></textarea>
                    </div>
                    <button class="btn-kirim" onclick="kirimPesan()">📤 Kirim</button>
                </div>
                
                <div class="card fade-in">
                    <div class="notes-header">
                        <h2>💬 Semua Pesan</h2>
                        <span id="totalPesan">0</span>
                    </div>
                    
                    <div class="button-group">
                        <button class="btn-refresh" onclick="tampilkanSemuaPesan()">🔄 Refresh</button>
                        <button class="btn-hapus-semua" onclick="hapusSemuaPesan()">🗑️ Hapus Semua</button>
                    </div>
                    
                    <div id="notesContainer" class="notes-list">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                            <div class="loading-text">Memuat pesan...</div>
                        </div>
                    </div>
                </div>
            `;
            
            tampilkanSemuaPesan();
        }
        
        function tampilkanPesan(pesan, tipe) {
            const container = document.getElementById('notesContainer');
            if (!container) return;
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${tipe} fade-in`;
            alertDiv.innerHTML = pesan;
            
            container.insertBefore(alertDiv, container.firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        // Start aplikasi
        cekSession();
    </script>
</body>
