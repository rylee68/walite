<!DOCTYPE html>
<html>
<head>
    <title>Simple Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        #messages { border: 1px solid #ccc; height: 400px; overflow: auto; padding: 10px; margin: 10px 0; background: #f9f9f9; }
        .message { margin: 5px 0; padding: 5px; border-bottom: 1px solid #eee; }
        .username { font-weight: bold; color: #0066cc; }
        .time { font-size: 11px; color: #999; margin-left: 10px; }
        input, button { padding: 8px; margin: 5px; }
        input { width: 200px; }
        button { cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0052a3; }
        .error { color: red; margin: 10px 0; }
        .success { color: green; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>💬 Simple Chat</h1>
    
    <div id="status" class="success">Loading...</div>
    
    <div id="loginBox">
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <button onclick="login()">Login</button>
    </div>
    
    <div id="chatBox" style="display:none">
        <div id="messages"></div>
        <div>
            <input type="text" id="message" placeholder="Ketik pesan..." autocomplete="off" style="width: 70%">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        // ========== KONFIGURASI SUPABASE ==========
        const SUPABASE_URL = 'https://fettznnppsfxyaogvgo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZldHR6bm5wcHNmeHlhb2d2Z2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAyMTAsImV4cCI6MjA5NTA4NjIxMH0.W3a3jWj_vpzCvHY6xVeS6zGdUvleY1n1c1hjrNHM824';
        // ==========================================
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = '';
        
        function setStatus(msg, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = msg;
            statusDiv.className = isError ? 'error' : 'success';
            console.log(msg);
        }
        
        window.login = async function() {
            currentUser = document.getElementById('username').value.trim();
            if (!currentUser) {
                alert('Masukkan username!');
                return;
            }
            
            setStatus('Mencoba koneksi...');
            
            const { error: testError } = await supabase.from('messages').select('count', { count: 'exact', head: true });
            
            if (testError) {
                setStatus('❌ Gagal: ' + testError.message, true);
                alert('Error: ' + testError.message);
                return;
            }
            
            setStatus('✅ Login sebagai: ' + currentUser);
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('chatBox').style.display = 'block';
            
            await loadMessages();
            subscribeToMessages();
        };
        
        async function loadMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);
            
            if (error) {
                setStatus('❌ Error: ' + error.message, true);
                return;
            }
            
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            
            if (!data || data.length === 0) {
                messagesDiv.innerHTML = '<div style="text-align:center;color:#999;">Belum ada pesan</div>';
                return;
            }
            
            data.forEach(msg => {
                messagesDiv.innerHTML += `
                    <div class="message">
                        <span class="username">${escapeHtml(msg.username)}</span>
                        <span class="time">${new Date(msg.created_at).toLocaleTimeString()}</span>
                        <div>${escapeHtml(msg.message)}</div>
                    </div>
                `;
            });
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            setStatus('✅ ' + data.length + ' pesan');
        }
        
        window.sendMessage = async function() {
            const msgInput = document.getElementById('message');
            const message = msgInput.value.trim();
            
            if (!message) return;
            
            const { error } = await supabase
                .from('messages')
                .insert([{ username: currentUser, message: message }]);
            
            if (error) {
                setStatus('❌ Gagal kirim: ' + error.message, true);
            } else {
                msgInput.value = '';
                setStatus('✅ Terkirim!');
            }
        };
        
        function subscribeToMessages() {
            supabase
                .channel('messages-channel')
                .on('postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'messages' },
                    (payload) => {
                        const messagesDiv = document.getElementById('messages');
                        if (messagesDiv.children.length === 1 && messagesDiv.children[0].innerText.includes('Belum ada pesan')) {
                            messagesDiv.innerHTML = '';
                        }
                        messagesDiv.innerHTML += `
                            <div class="message">
                                <span class="username">${escapeHtml(payload.new.username)}</span>
                                <span class="time">${new Date(payload.new.created_at).toLocaleTimeString()}</span>
                                <div>${escapeHtml(payload.new.message)}</div>
                            </div>
                        `;
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    })
                .subscribe();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
            document.getElementById('message').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });
    </script>
</body>
</html>
